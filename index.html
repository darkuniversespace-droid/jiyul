<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>StudyLoop – AI 학습 & 컨디션 케어 플래너</title>
<style>
:root{--bg:#000;--card:#141414;--pri:#fff;--pri2:#262626;--tx:#f0f0f0;--sub:#9a9a9a;--bd:#333;color-scheme:dark}
svg text{fill:#ddd}a{color:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--tx);padding-bottom:70px;filter:grayscale(1)}
header{background:#000;border-bottom:1px solid #333;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{margin:0;font-size:20px}header small{opacity:.75;display:block;font-size:12px}
header .btn{background:#fff;color:#000;padding:6px 10px;font-size:13px}
main{max-width:780px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:16px}.card h3{margin:10px 0 4px;font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #333;display:flex;z-index:5}
nav button{flex:1;border:0;background:none;padding:7px 0;font-size:10px;color:#999;cursor:pointer}
nav button b{display:block;font-size:18px;font-weight:400}
nav button.on{color:#fff;font-weight:700}
.btn{background:#fff;color:#000;border:1px solid #fff;border-radius:8px;padding:8px 13px;font-size:14px;cursor:pointer}
.btn.sec{background:transparent;color:#fff;border-color:#666}.btn.bad{background:transparent;color:#ccc;border:1px dashed #777}.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.4}
input,select,textarea{width:100%;padding:8px;border:1px solid #555;border-radius:8px;font:inherit;background:#1c1c1c;color:#fff}
textarea{min-height:80px}
label{display:block;font-size:12px;color:var(--sub);margin:8px 0 3px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:100px}.row>.btn{flex:0 0 auto}
.muted{color:var(--sub);font-size:13px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--pri2);color:#fff;border:1px solid #555}
.pill.dark{background:#fff;color:#000;border-color:#fff}
.score{font-size:40px;font-weight:800}
.slot{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--bd);align-items:center}
.slot:last-child{border:0}.slot .t{width:92px;font-size:12px;color:var(--sub);flex:none}.slot .n{flex:1}
.slot.busy .n{color:#aaa;font-style:italic}.slot.brk .n{color:#888}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal div{min-height:54px;border:1px solid var(--bd);border-radius:6px;padding:3px;font-size:10px;cursor:pointer;background:var(--card);overflow:hidden;line-height:1.35}
.cal .h{min-height:0;border:0;text-align:center;color:var(--sub);cursor:default;font-size:12px}
.cal .today{border:2px solid #fff}.cal .off{border:1px dashed #aaa;background:repeating-linear-gradient(45deg,#1a1a1a,#1a1a1a 5px,#262626 5px,#262626 10px)}.cal .sel{background:#fff;color:#000}
.cal .exam{font-weight:800;text-decoration:underline}
.timer{font-size:54px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
details{margin:6px 0}summary{cursor:pointer;font-weight:600;font-size:14px}
.q{padding:8px 0;border-bottom:1px solid var(--bd)}.q label{display:flex;gap:6px;align-items:center;color:var(--tx);font-size:14px;margin:3px 0}
.q label input{width:auto}
.q.right{background:#2a2a2a;border-left:4px solid #fff;padding-left:6px}.q.wrong{background:transparent;border-left:4px dashed #fff;padding-left:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:#fff;color:#000;padding:9px 16px;border-radius:99px;font-size:13px;display:none;z-index:9;max-width:90%}
.en{line-height:1.8;font-size:16px;white-space:pre-wrap}
.bar{background:#333;border-radius:4px;height:14px;overflow:hidden}.bar i{display:block;height:100%;background:#fff}
.seg{display:flex;gap:6px;margin:6px 0}.seg .btn{flex:1}
.thumb{max-width:140px;max-height:140px;border:1px solid var(--bd);border-radius:8px}
.big{font-size:30px;font-weight:800}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.grid3>div{border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center}
.mode{border:2px solid #fff;border-radius:10px;padding:8px;margin-bottom:12px;font-size:13px}
</style>
</head>
<body>
<header><div><h1>🔁 StudyLoop</h1><small>AI 학습 & 컨디션 케어 플래너</small></div><div><button class="btn" data-act="mode" id="modeBtn"></button> <button class="btn" data-act="tab" data-t="settings">⚙</button></div></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="toast"></div>

<script>
"use strict";
/* ========== 유틸 ========== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 864e5);
const toMin = t => { const [h, m] = (t || "0:0").split(":").map(Number); return h * 60 + m; };
const fmt = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return `${pad(Math.floor(m/60))}:${pad(m%60)}`; };
const uid = () => Math.random().toString(36).slice(2, 9);
const compact = s => s.replace(/-/g, "");
const dashed = s => `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`;
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const r1 = x => Math.round(x * 10) / 10;
function toast(msg, ms = 3000) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", ms); }
const val = id => ($("#" + id) || {}).value || "";

/* ========== 저장소 (모든 데이터는 이 기기의 localStorage에만 저장) ========== */
const KEY = "studyloop.v2";
const defaults = () => ({
  settings: { apiKey: "", model: "gemini-2.0-flash", mode: "school", wakeS: "06:50", sleepS: "23:00", wakeV: "08:00", sleepV: "24:00",
    schoolStart: "08:40", schoolEnd: "15:30", period: 50, neisKey: "", grade: "", cls: "", proxy: "allorigins" },
  subjects: [], materials: [], events: [], memos: [], exams: [], dayOffs: [], sleep: {}, usage: {}, reviews: [], quizzes: {}, quizLog: [],
  studyLog: [], workbook: [], english: {}, wbDone: {}, notes: [], plan: {}, school: null,
  neis: { timetable: {}, meals: {}, sched: {} }, ai: {}
});
let S = (() => { try { return Object.assign(defaults(), JSON.parse(localStorage.getItem(KEY)) || {}); } catch { return defaults(); } })();
S.settings = Object.assign(defaults().settings, S.settings);
S.neis = Object.assign(defaults().neis, S.neis);
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch { toast("저장 공간이 가득 찼습니다. 오래된 자료를 삭제해 주세요."); return false; }
}
const isSchool = () => S.settings.mode === "school";
const isOff = d => S.dayOffs.includes(d);

/* ========== Gemini ========== */
async function gemini(parts, json = true) {
  const k = S.settings.apiKey.trim();
  if (!k) throw new Error("설정에서 Gemini API 키를 먼저 입력해 주세요.");
  const body = { contents: [{ parts }] };
  if (json) body.generationConfig = { responseMimeType: "application/json" };
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(S.settings.model)}:generateContent?key=${encodeURIComponent(k)}`,
    { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((j.error && j.error.message) || ("AI 호출 실패 (" + r.status + ")"));
  const txt = ((j.candidates || [])[0]?.content?.parts || []).map(p => p.text || "").join("");
  if (!json) return txt;
  try { return JSON.parse(txt.replace(/^```json|```$/g, "").trim()); }
  catch { throw new Error("AI 응답을 해석하지 못했습니다. 다시 시도해 주세요."); }
}
const QUIZ_SCHEMA = `"quiz":[{"q":"문제","choices":["보기1","보기2","보기3","보기4"],"answer":0,"explain":"해설"}]`;

/* ========== NEIS (학교 · 시간표 · 급식 · 학사일정) ========== */
const PROXIES = { allorigins: u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u), corsproxy: u => "https://corsproxy.io/?" + encodeURIComponent(u) };
async function fetchProxy(url, min = 500) {
  const order = [S.settings.proxy, ...Object.keys(PROXIES).filter(k => k !== S.settings.proxy)];
  for (const p of order) {
    try { const r = await fetch(PROXIES[p](url)); if (r.ok) { const t = await r.text(); if (t.length > min) return t; } } catch { }
  }
  throw new Error("프록시 접속 실패");
}
async function neis(ep, params) {
  const key = S.settings.neisKey.trim();
  const q = new URLSearchParams({ Type: "json", pIndex: "1", pSize: key ? "1000" : "5", ...params });
  if (key) q.set("KEY", key);
  const url = `https://open.neis.go.kr/hub/${ep}?${q}`;
  let txt;
  try { const r = await fetch(url); txt = await r.text(); } catch { txt = await fetchProxy(url, 2); }
  const j = JSON.parse(txt);
  if (j.RESULT && !j[ep]) { if (j.RESULT.CODE === "INFO-200") return []; throw new Error(j.RESULT.MESSAGE || "NEIS 오류"); }
  return ((j[ep] || [])[1] || {}).row || [];
}
const EP = { "초등학교": "elsTimetable", "중학교": "misTimetable", "고등학교": "hisTimetable" };
let schoolRes = [];
const cleanDish = s => s.replace(/<br\s*\/?>/g, " · ").replace(/\s*\([\d.]+\)/g, "").replace(/\s*[\d.]+(?=\s|$)/g, "");
function isHoliday(date) {
  return (S.neis.sched[date] || []).some(e => e.t === "휴업일" || /공휴일|재량휴업/.test(e.n) || (/방학/.test(e.n) && !/방학식|개학/.test(e.n)));
}
function schoolBlock(date) {
  if (!isSchool()) return null;
  const dow = new Date(date + "T00:00:00").getDay();
  if (dow === 0 || dow === 6 || isHoliday(date)) return null;
  const st = toMin(S.settings.schoolStart), tt = S.neis.timetable[date], manual = (S.settings.endDay || {})[dow];
  if (manual) return { s: st, e: toMin(manual), title: "🏫 학교" };
  if (tt && tt.length) {
    const n = Math.max(...tt.map(x => +x.p)), unit = +S.settings.period || 50;
    return { s: st, e: st + n * unit + (n - 1) * 10 + (n >= 5 ? 50 : 0), title: `🏫 학교 (${n}교시)` };
  }
  return { s: st, e: toMin(S.settings.schoolEnd), title: "🏫 학교" };
}

/* ========== 컨디션 / 강도 (수면 기반 · 스마트폰 사용시간은 통계로만 사용) ========== */
function condition(date = today()) {
  const sl = S.sleep[date]; if (!sl) return null;
  let score = Math.min(100, sl.hours / 8 * 75) + (sl.quality - 3) * 5; const notes = [];
  if (sl.hours < 6) notes.push("수면이 6시간 미만이에요. 오늘은 무리하지 말고 핵심 위주로!");
  else if (sl.hours >= 7) notes.push("수면이 충분해요. 집중력이 좋은 날이에요.");
  score = Math.max(0, Math.min(100, Math.round(score)));
  const level = score >= 75 ? { k: "high", name: "높음", mult: 1.2, block: 50 } : score >= 50 ? { k: "mid", name: "보통", mult: 1, block: 40 } : { k: "low", name: "낮음", mult: .7, block: 25 };
  return { score, level, notes, sl };
}
const defaultLevel = { k: "mid", name: "보통(데이터 없음)", mult: 1, block: 40 };

/* ========== 시험 · 복습(에빙하우스) ========== */
const INTERVALS = [1, 3, 7, 14, 30];
const reviewSubj = r => {
  if (r.matId.startsWith("N:")) { const n = S.notes.find(x => x.id === r.matId.slice(2)); return n && n.sub; }
  const m = S.materials.find(x => x.id === r.matId); return m && m.sub;
};
const upcomingExams = () => S.exams.filter(e => e.date >= today()).sort((a, b) => a.date.localeCompare(b.date));
const examSubs = e => e.subs || (e.sub ? [subName(e.sub)] : []);
const examFor = sub => upcomingExams().find(e => !examSubs(e).length || examSubs(e).includes(subName(sub)));
const cutoffOf = e => addDays(e.date, -7);

// 시험 1주 전까지 모든 복습이 끝나도록 압축하고, 하루 4개를 넘지 않게 분산
function planReviews(silent) {
  const t = today(), cap = 4, groups = {}; let moved = 0;
  const open = S.reviews.filter(r => !r.done);
  open.forEach(r => { r.lim = null; const e = examFor(reviewSubj(r)); if (e) r.lim = cutoffOf(e) < t ? t : cutoffOf(e); });
  open.filter(r => r.lim && r.due > r.lim).forEach(r => (groups[r.matId + "|" + r.lim] = groups[r.matId + "|" + r.lim] || []).push(r));
  Object.values(groups).forEach(g => {
    g.sort((a, b) => a.n - b.n);
    const lim = g[0].lim, prev = open.filter(r => r.matId === g[0].matId && !g.includes(r) && r.due <= lim).map(r => r.due);
    const start = [t, ...prev].sort().pop(), span = Math.max(0, diffDays(start, lim));
    g.forEach((r, i) => { r.due = addDays(start, Math.round(span * (i + 1) / g.length)); moved++; });
  });
  const load = {};
  open.sort((a, b) => a.due.localeCompare(b.due) || a.n - b.n).forEach(r => {
    let d = r.due < t ? t : r.due; const first = d; let guard = 0;
    if (r.due < t) moved++;
    const ok = x => !isOff(x) && (load[x] || 0) < cap;
    while (!ok(d) && (!r.lim || d < r.lim) && guard++ < 400) d = addDays(d, 1);
    if (!ok(d)) { d = first; while (!ok(d) && d > t) d = addDays(d, -1); if (!ok(d)) d = first; }
    if (d !== r.due && r.due >= t) moved++;
    load[d] = (load[d] || 0) + 1; r.due = d;
  });
  open.forEach(r => delete r.lim);
  if (moved) { save(); if (!silent) toast(`복습 일정 ${moved}건을 자동 재조정했어요.`); }
}
function scheduleReviews(matId, title, base = today()) {
  INTERVALS.forEach((d, i) => S.reviews.push({ id: uid(), matId, title, due: addDays(base, d), n: i + 1, done: false }));
  planReviews(true);
}

/* ========== 스케줄러 ========== */
function workbookQuota(w, lvl) {
  const left = Math.max(0, w.total - w.done); if (!left || isOff(today())) return 0;
  let days = 0; for (let d = today(); d <= w.due; d = addDays(d, 1)) if (!isOff(d)) days++;
  days = Math.max(1, days);
  return Math.min(left, Math.max(1, Math.ceil(left / days * lvl.mult)));
}
function buildSchedule(date = today()) {
  const c = condition(date), lvl0 = c ? c.level : defaultLevel;
  const lvl = isSchool() ? lvl0 : { ...lvl0, block: lvl0.block + 10 };
  const wake = toMin(isSchool() ? S.settings.wakeS : S.settings.wakeV); let sleepM = toMin(isSchool() ? S.settings.sleepS : S.settings.sleepV);
  if (sleepM <= wake) sleepM += 1440;
  const winS = wake + 30, winE = sleepM - 60;
  const busy = S.events.filter(e => e.date === date).map(e => ({ s: toMin(e.start), e: toMin(e.end), title: e.title, evId: e.id })).filter(b => b.e > b.s);
  const sb = schoolBlock(date); if (sb) busy.push({ ...sb, school: true });
  busy.sort((a, b) => a.s - b.s);
  const tasks = [], off = isOff(date);
  if (!off) {
  S.reviews.filter(r => !r.done && r.due <= date).forEach(r => tasks.push({ kind: "review", key: "r:" + r.id, id: r.id, title: `🔁 복습 ${r.n}회차: ${r.title}`, dur: 15 }));
  const en = S.english[date]; if (!en || !en.done) tasks.push({ kind: "english", key: "e", title: "🌐 오늘의 영어 독해", dur: 15 });
  S.workbook.forEach(w => { const q = workbookQuota(w, lvl); if (q && !(S.wbDone[date] || {})[w.id]) tasks.push({ kind: "wb", key: "w:" + w.id, id: w.id, title: `📘 ${w.title} ${q}${w.unit}`, dur: Math.max(10, q * w.per) }); });
  }
  if (date === today()) { // 이행률 계산용: 오늘 계획된 항목 기록
    const p = (S.plan[date] = S.plan[date] || {}); let add = 0;
    tasks.forEach(t => { if (!(t.key in p)) { p[t.key] = t.title; add++; } }); if (add) save();
  }
  const free = []; let cur = winS;
  busy.forEach(b => { if (b.s > cur) free.push([cur, Math.min(b.s, winE)]); cur = Math.max(cur, b.e); });
  if (cur < winE) free.push([cur, winE]);
  const out = busy.map(b => ({ s: b.s, e: b.e, title: b.title, kind: "busy", evId: b.evId, school: b.school }));
  const queue = tasks.map(t => ({ ...t, left: t.dur }));
  free.forEach(([fs, fe]) => {
    let p = fs;
    while (queue.length && fe - p >= 10) {
      const t = queue[0], chunk = Math.min(t.left, lvl.block, fe - p);
      out.push({ s: p, e: p + chunk, title: t.title + (t.left > chunk ? " (이어서)" : ""), kind: t.kind, id: t.id });
      p += chunk; t.left -= chunk;
      if (t.left <= 0) queue.shift();
      if (queue.length && fe - p > 10) { out.push({ s: p, e: p + 10, title: "☕ 휴식", kind: "brk" }); p += 10; }
    }
  });
  out.sort((a, b) => a.s - b.s);
  return { slots: out, overflow: queue, lvl, c };
}

/* ========== 이행률 / 통계 계산 ========== */
function planDone(date, key) {
  if (key === "e") return !!(S.english[date] && S.english[date].done);
  if (key.startsWith("w:")) return !!(S.wbDone[date] || {})[key.slice(2)];
  const r = S.reviews.find(x => x.id === key.slice(2)); return !!(r && r.done && r.doneOn === date);
}
function dayStats(date) {
  const p = S.plan[date] || {}, keys = Object.keys(p), done = keys.filter(k => planDone(date, k)).length;
  return { date, planned: keys.length, done, rate: keys.length ? Math.round(done / keys.length * 100) : null,
    min: S.studyLog.filter(l => l.date === date).reduce((a, l) => a + (l.min || 0), 0), items: keys.map(k => ({ t: p[k], ok: planDone(date, k) })) };
}
const topicOf = n => (n.ai && n.ai.topic) || n.topic || "미분류";
const subName = id => (S.subjects.find(s => s.id === id) || {}).name || "기타";
function weakness() {
  const g = {};
  S.notes.forEach(n => { const k = subName(n.sub) + " · " + topicOf(n); (g[k] = g[k] || { k, c: 0, types: {} }).c++; if (n.ai && n.ai.errorType) g[k].types[n.ai.errorType] = 1; });
  return Object.values(g).sort((a, b) => b.c - a.c).map(x => ({ ...x, share: Math.round(x.c / S.notes.length * 100) }));
}
function sleepLink() {
  const grp = { low: { t: 0, ok: 0, notes: 0, days: 0 }, hi: { t: 0, ok: 0, notes: 0, days: 0 } };
  Object.keys(S.sleep).forEach(d => {
    const g = S.sleep[d].hours <= 6 ? grp.low : grp.hi; g.days++;
    S.quizLog.filter(q => q.date === d).forEach(q => { g.t += q.total; g.ok += q.ok; });
    g.notes += S.notes.filter(n => n.date === d).length;
  });
  const out = [];
  if (grp.low.t && grp.hi.t) {
    const a = Math.round((1 - grp.low.ok / grp.low.t) * 100), b = Math.round((1 - grp.hi.ok / grp.hi.t) * 100);
    out.push(`수면 6시간 이하인 날 퀴즈 오답률 ${a}% vs 7시간 이상인 날 ${b}%${a > b ? " → 잠이 부족하면 오답이 늘어요." : "."}`);
  }
  if (grp.low.days && grp.hi.days) {
    const a = r1(grp.low.notes / grp.low.days), b = r1(grp.hi.notes / grp.hi.days);

function loadScript(src) { return new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => no(new Error("라이브러리 로딩 실패(인터넷 연결 확인)")); document.head.appendChild(s); }); }
async function pdfText(file) {
  if (!window.pdfjsLib) {
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  let out = "";
  for (let i = 1; i <= pdf.numPages && out.length < 60000; i++) {
    const tc = await (await pdf.getPage(i)).getTextContent();
    out += `\n[p.${i}] ` + tc.items.map(x => x.str).join(" ");
  }
  return out.trim();
}
function imageB64(file, max = 1280, q = .8) {
  return new Promise((ok, no) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      ok(c.toDataURL("image/jpeg", q).split(",")[1]);
    };
    img.onerror = () => no(new Error("이미지를 읽을 수 없어요.")); img.src = u;
  });
}
async function analyze(text, imgB64, subNm, publisher, title) {
  const prompt = `너는 한국 학생의 학습 도우미다. 아래 ${imgB64 ? "학습지 사진" : "교재 텍스트"}를 분석해 JSON만 출력해라. 과목: ${subNm || "미지정"}, 출판사: ${publisher || "미지정"}, 제목: ${title}.
형식: {"ocr":"사진이면 인식한 텍스트 전문(아니면 빈 문자열)","summary":"3~5문장 핵심 요약","concepts":[{"term":"용어","explain":"심화 설명"}],"extended":["교과 밖 확장 지식 3~5개"],${QUIZ_SCHEMA}}
quiz는 4지선다 5문제, answer는 정답 인덱스(0~3). 모든 내용은 한국어로.`;
  const parts = [{ text: prompt }];
  if (imgB64) parts.push({ inlineData: { mimeType: "image/jpeg", data: imgB64 } }); else parts.push({ text: text.slice(0, LIMIT) });

function quizBox() {
  const q = S.quizzes[today()];
  if (!q) return `<button class="btn" data-act="genQuiz">퀴즈 만들기</button><p class="muted">API 키가 없으면 저장된 자료·오답에서 문제를 만들어요.</p>`;
  return quizHtml(q.items, "dq") + ` <button class="btn sm sec" data-act="genQuiz">다시 만들기</button>`;
}
function quizSource() {
  const y = addDays(today(), -1);
  const ids = [...new Set(S.studyLog.filter(l => l.date === y && l.matId && !l.matId.startsWith("N:")).map(l => l.matId))];
  let mats = ids.map(id => S.materials.find(m => m.id === id)).filter(Boolean);
  const titles = S.studyLog.filter(l => l.date === y).map(l => l.title);
  if (!mats.length) mats = S.materials.slice(-2);
  const top = weakness().slice(0, 3).map(x => x.k);
  const notes = S.notes.filter(n => n.date === y || top.includes(subName(n.sub) + " · " + topicOf(n))).slice(-6);
  return { mats, titles, notes, top };
}
function clozeQuiz(mats) {
  const sents = mats.flatMap(m => m.text.replace(/\[p\.\d+\]/g, "").split(/(?<=[.!?다요])\s+/)).filter(s => s.length > 25 && s.length < 200);
  const words = [...new Set(sents.flatMap(s => s.match(/[가-힣A-Za-z]{3,}/g) || []))], items = [];
  for (const s of sents.sort(() => Math.random() - .5)) {
    const ws = (s.match(/[가-힣A-Za-z]{3,}/g) || []).filter(() => words.length > 4); if (!ws.length) continue;
    const ans = ws[Math.floor(ws.length / 2)], wrong = words.filter(w => w !== ans).sort(() => Math.random() - .5).slice(0, 3);
    if (wrong.length < 3) continue;
    const choices = [...wrong, ans].sort(() => Math.random() - .5);
    items.push({ q: "빈칸에 알맞은 말은? " + s.replace(ans, "_____"), choices, answer: choices.indexOf(ans), explain: `정답: ${ans}` });
    if (items.length >= 5) break;
  }
  return items;
}
acts.genQuiz = async () => {
  const { mats, titles, notes, top } = quizSource();
  if (!mats.length && !notes.length) return toast("먼저 학습 자료나 오답노트를 저장해 주세요.");
  const premade = notes.flatMap(n => (n.ai && n.ai.quiz) || []);
  toast("퀴즈 만드는 중…", 60000);
  let items;
  try {
    const ctx = mats.map(m => `# ${m.title}\n${(m.ai ? m.ai.summary + "\n" : "") + m.text.slice(0, 3000)}`).join("\n\n");
    const weak = notes.map(n => `- ${subName(n.sub)} ${topicOf(n)}: ${(n.ai && n.ai.concept) || n.text || ""}`.slice(0, 200)).join("\n");
    const r = await gemini([{ text: `학생이 어제 공부한 내용(${titles.join(", ")})과 취약 개념이다. 복습용 4지선다 5문제를 JSON {${QUIZ_SCHEMA}} 로 한국어로 출제해라. 취약 개념(${top.join(", ") || "없음"})에서 최소 2문제를 포함해라.\n\n[취약 개념]\n${weak}\n\n[학습 내용]\n${ctx}` }]);
    items = r.quiz;
  } catch (e) {
    items = [...premade.slice(0, 3), ...clozeQuiz(mats)].slice(0, 5);
    toast(S.settings.apiKey ? "⚠ AI 실패, 저장된 자료로 대체: " + e.message : "API 키가 없어 저장된 자료로 퀴즈를 만들었어요.", 5000);
  }
  if (!items || !items.length) return toast("퀴즈를 만들 수 없어요(자료가 너무 짧아요).");
  S.quizzes[today()] = { items }; save(); render();
};

function beep() { try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(); o.connect(c.destination); o.frequency.value = 880; o.start(); o.stop(c.currentTime + .6); } catch { } }
acts.noise = () => {
  if (au.src) { au.src.stop(); au.src = null; return render(); }
  const c = au.ctx || (au.ctx = new (window.AudioContext || window.webkitAudioContext)()), type = val("noiseT"), len = c.sampleRate * 4, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  let b0 = 0, b1 = 0, b2 = 0, last = 0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    if (type === "white") d[i] = w;
    else if (type === "pink") { b0 = .99765 * b0 + w * .099046; b1 = .963 * b1 + w * .2965164; b2 = .57 * b2 + w * 1.0526913; d[i] = (b0 + b1 + b2 + w * .1848) * .3; }
    else { last = (last + .02 * w) / 1.02; d[i] = last * 3.5; }
  }
  au.src = c.createBufferSource(); au.src.buffer = buf; au.src.loop = true; au.gain = c.createGain(); au.gain.gain.value = +val("noiseV");
  au.src.connect(au.gain).connect(c.destination); au.src.start(); c.resume(); render();
};

    <div class="row"><div><label>학교 이름</label><input id="scQ" placeholder="예: 한빛중학교"></div><button class="btn" data-act="schoolSearch">검색</button></div>
    ${schoolRes.map((r, i) => `<div class="slot"><div class="n">${esc(r.name)} <span class="muted">${esc(r.kind)} · ${esc(r.addr)}</span></div><button class="btn sm sec" data-act="schoolPick" data-i="${i}">선택</button></div>`).join("")}
    <div class="row"><div><label>학년</label><input id="stG" type="number" min="1" value="${esc(s.grade)}"></div><div><label>반</label><input id="stC" type="number" min="1" value="${esc(s.cls)}"></div></div>
    <label>NEIS 인증키 (선택 · <a href="https://open.neis.go.kr" target="_blank" rel="noopener">open.neis.go.kr</a>에서 무료 발급. 없으면 일부(5건)만 불러와요)</label><input id="stN" type="password" value="${esc(s.neisKey)}">
    <p><button class="btn" data-act="neisSync">시간표 · 급식 · 학사일정 불러오기</button></p></div>
  <div class="card"><h2>⏰ 학기중 / 방학 시간</h2>
    <div class="row"><div><label>학기중 기상</label><input id="stWS" type="time" value="${s.wakeS}"></div><div><label>학기중 취침</label><input id="stSS" type="time" value="${s.sleepS}"></div></div>
    <div class="row"><div><label>방학 기상</label><input id="stWV" type="time" value="${s.wakeV}"></div><div><label>방학 취침</label><input id="stSV" type="time" value="${s.sleepV}"></div></div>
    <div class="row"><div><label>등교(수업 시작)</label><input id="stSt" type="time" value="${s.schoolStart}"></div><div><label>하교 (시간표 없을 때)</label><input id="stEn" type="time" value="${s.schoolEnd}"></div><div><label>수업 1교시(분)</label><input id="stPe" type="number" value="${s.period}"></div></div>
    <label>요일별 하교 시간 (비워 두면 시간표 또는 기본 하교 시간 사용)</label>
    <div class="row">${[1, 2, 3, 4, 5].map(i => `<div><label>${"일월화수목금토"[i]}</label><input class="stDay" data-d="${i}" type="time" value="${(s.endDay || {})[i] || ""}"></div>`).join("")}</div>
    <p class="muted">학기중에는 시간표(없으면 하교 시간)만큼 '학교' 시간을 빼고 계획하고, 방학에는 하루 전체를 써요. 상단 버튼으로 전환하세요.</p></div>
  <div class="card"><h2>🤖 AI · 기타</h2>
    <label>Gemini API 키 (이 기기 localStorage에만 저장 · <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">무료 키 발급</a>)</label><input id="stK" type="password" value="${esc(s.apiKey)}" placeholder="AIza...">
    <label>모델</label><input id="stM" value="${esc(s.model)}">
    <label>영어 지문 CORS 프록시</label><select id="stP"><option value="allorigins" ${s.proxy === "allorigins" ? "selected" : ""}>allorigins</option><option value="corsproxy" ${s.proxy === "corsproxy" ? "selected" : ""}>corsproxy.io</option></select>
    <p><button class="btn" data-act="saveSet">저장</button></p></div>
  <div class="card"><h2>🔒 개인정보 안내</h2><p class="muted">모든 학습 데이터·수면·사용시간은 이 브라우저(localStorage)에만 저장되며 운영자 서버가 없습니다. AI 분석 시 업로드한 자료(축소된 텍스트/사진)만 사용자의 키로 Google Gemini API에 전송됩니다. 교과서·지문은 개인 학습 용도로만 사용하세요.</p>
  <button class="btn sec" data-act="export">데이터 내보내기(JSON)</button> <button class="btn bad" data-act="wipe">전체 삭제</button></div>`;
};
function readSettings() {
  S.settings.endDay = {}; document.querySelectorAll(".stDay").forEach(i => { if (i.value) S.settings.endDay[i.dataset.d] = i.value; });
  Object.assign(S.settings, { grade: val("stG"), cls: val("stC"), neisKey: val("stN").trim(), wakeS: val("stWS"), sleepS: val("stSS"), wakeV: val("stWV"), sleepV: val("stSV"),
    schoolStart: val("stSt"), schoolEnd: val("stEn"), period: +val("stPe") || 50, apiKey: val("stK").trim(), model: val("stM").trim() || "gemini-2.0-flash", proxy: val("stP") });
}
acts.saveSet = () => { readSettings(); save(); toast("저장됨"); };
acts.schoolSearch = async () => {
  readSettings(); if (!val("scQ").trim()) return toast("학교 이름을 입력해 주세요.");
  toast("검색 중…", 30000);
  try {
    schoolRes = (await neis("schoolInfo", { SCHUL_NM: val("scQ").trim() })).map(r => ({ name: r.SCHUL_NM, atpt: r.ATPT_OFCDC_SC_CODE, code: r.SD_SCHUL_CODE, kind: r.SCHUL_KND_SC_NM, addr: r.ORG_RDNMA || "" }));
    toast(schoolRes.length ? `${schoolRes.length}개 학교를 찾았어요.` : "검색 결과가 없어요.");
  } catch (e) { toast("⚠ " + e.message, 5000); }
  save(); render();
};
acts.schoolPick = d => { const r = schoolRes[+d.i]; S.school = { ...r, ep: EP[r.kind] || "spsTimetable" }; schoolRes = []; save(); render(); };
acts.neisSync = async () => {
  readSettings(); const sc = S.school; if (!sc) return toast("먼저 학교를 선택해 주세요."); save();
  toast("NEIS에서 불러오는 중…", 90000);
  const base = { ATPT_OFCDC_SC_CODE: sc.atpt, SD_SCHUL_CODE: sc.code }, t = today(), mon = addDays(t, -((new Date(t + "T00:00:00").getDay() + 6) % 7)), fails = [], got = [];
  const run = async (name, f) => { try { got.push(name + " " + await f()); } catch (e) { fails.push(name + ": " + e.message); } };
  await run("시간표", async () => {
    if (!S.settings.grade || !S.settings.cls) throw new Error("학년/반을 입력해 주세요");
    const rows = await neis(sc.ep, { ...base, GRADE: S.settings.grade, CLASS_NM: S.settings.cls, TI_FROM_YMD: compact(mon), TI_TO_YMD: compact(addDays(mon, 13)) });
    for (let i = 0; i < 14; i++) delete S.neis.timetable[addDays(mon, i)];
    rows.forEach(r => (S.neis.timetable[dashed(r.ALL_TI_YMD)] = S.neis.timetable[dashed(r.ALL_TI_YMD)] || []).push({ p: r.PERIO, c: r.ITRT_CNTNT }));
    Object.values(S.neis.timetable).forEach(a => a.sort((x, y) => x.p - y.p));
    return rows.length + "건";
  });
  await run("급식", async () => {
    const rows = await neis("mealServiceDietInfo", { ...base, MLSV_FROM_YMD: compact(addDays(t, -3)), MLSV_TO_YMD: compact(addDays(t, 40)) });
    rows.forEach(r => { const d = dashed(r.MLSV_YMD); S.neis.meals[d] = (S.neis.meals[d] || []).filter(x => x.m !== r.MMEAL_SC_NM); S.neis.meals[d].push({ m: r.MMEAL_SC_NM, n: cleanDish(r.DDISH_NM) }); });
    return rows.length + "건";
  });
  await run("학사일정", async () => {
    const rows = await neis("SchoolSchedule", { ...base, AA_FROM_YMD: compact(addDays(t, -30)), AA_TO_YMD: compact(addDays(t, 200)) });
    S.neis.sched = {}; rows.forEach(r => (S.neis.sched[dashed(r.AA_YMD)] = S.neis.sched[dashed(r.AA_YMD)] || []).push({ n: r.EVENT_NM, t: r.SBTR_DD_SC_NM }));
    return rows.length + "건";
  });
  save(); toast((got.length ? "불러옴: " + got.join(", ") : "") + (fails.length ? " ⚠ " + fails.join(" / ") : ""), 8000); render();
};
acts.export = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify({ ...S, settings: { ...S.settings, apiKey: "", neisKey: "" } }, null, 1)], { type: "application/json" })); a.download = "studyloop-backup.json"; a.click(); };
acts.wipe = () => { if (confirm("모든 데이터를 삭제할까요?")) { localStorage.removeItem(KEY); S = defaults(); render(); } };

/* ========== 이벤트 ========== */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.tagName === "A") e.preventDefault();
  const f = acts[b.dataset.act]; if (f) f(b.dataset, b);
});
planReviews(false);
render();
</script>
</body>
</html>
